name: Hardware validation lint

on:
  push:
    branches:
      - main
      - feature/hardware-validation-v0.4
  pull_request:

permissions:
  contents: read

jobs:
  powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse hardware validation PowerShell
        shell: powershell
        run: .\windows\Test-DadLAN-HardwareValidation.ps1
      - name: Exercise safety failure paths without hardware load
        shell: powershell
        run: .\windows\Test-DadLAN-HardwareSafety.ps1
